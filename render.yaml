services:
  - type: web
    name: marina-cgyc
    runtime: docker
    plan: free
    envVars:
      - key: APP_NAME
        value: "Marina CGYC"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: marina-cgyc-db
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: marina-cgyc-db
          property: connectionString
      - key: DB_HOST
        fromDatabase:
          name: marina-cgyc-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: marina-cgyc-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: marina-cgyc-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: marina-cgyc-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: marina-cgyc-db
          property: password

databases:
  - name: marina-cgyc-db
    databaseName: marina_cgyc
    user: marina_cgyc_user
    plan: free
